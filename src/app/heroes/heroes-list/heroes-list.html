

<div class="card">
  <div class="card-head">
    <h1>HEROES DRAGON BALL</h1>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <input [(ngModel)]="listFilter" type="text" class="form-control"
          placeholder="ingrese nombre del heroe">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <h3>Filtro: {{listFilter}}</h3>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-striped" *ngIf="heroes.length>0">
          <thead>
            <tr>
              <th><button (click)="showImage()" class="btn btn-primary">{{muestraImage?'ocultar ':'Muestra '}}Imagen</button></th>
              <th>Nombre</th>
              <th>Descripcion</th>
              <th>Raza</th>
              <th>Ki</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let heroe of heroes">
              <td><img  *ngIf="muestraImage" [src]="heroe.imagen"
                [style.width.px]="imageWidth"
                [style.margin.px]="imageMargin"></td>
              <td>{{heroe.nombre}}</td>
              <td>{{heroe.descripcion}}</td>
              <td>{{heroe.race}}</td>
              <td>{{heroe.ki}}</td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>
  </div>
</div>

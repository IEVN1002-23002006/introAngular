<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-6">
        <div class="mb-3">
          <form>
            <div class="form.group pt-4">
              <label  for="num1">Numero 1:</label>
              <input [(ngModel)]="num1"] name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese numero 1">
            </div>
            <div class="form-group pt-4">
              <label for="num2">Numero 2:</label>
              <input [(ngModel)]="num2"] name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese numero 2">
            </div>
            <br>
            <div class="form-check">
            <input [(ngModel)]="operacion"] class="form-check-input" type="radio" name="radioDefault" id="radioDefault1" value="sumar">
            <label  class="form-check-label" for="radioDefault1">
              sumar
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="operacion"] class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" value="restar">
            <label class="form-check-label" for="radioDefault2">
              restar
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="operacion"]class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" value="multiplicar">
            <label  class="form-check-label" for="radioDefault2">
              multiplicar
            </label>
          </div>
          <div class="form-check">
            <input [(ngModel)]="operacion"] class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" value="dividir">
            <label  class="form-check-label" for="radioDefault2">
              dividir
            </label>
          </div>
          <button (click)="calcular()"  type="button" class="btn btn-primary">
              calcular
            </button>
          </form>
        </div>
        <div class="col-6">
          <h3>Resultado: {{resultado}}</h3>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
